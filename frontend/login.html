<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — GenMark AI</title>
  <meta name="description" content="GenMark AI에 로그인하여 AI 로고 생성을 시작하세요." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="nav scrolled" id="main-nav">
    <div class="nav-inner">
      <a href="index.html" class="logo" id="nav-logo">
        <span class="logo-mark">G</span>
        <span class="logo-text">GenMark<span class="logo-ai">AI</span></span>
      </a>
    </div>
  </nav>

  <div class="auth-page">
    <!-- Background orbs -->
    <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none;">
      <div class="hero-orb orb-1"></div>
      <div class="hero-orb orb-2"></div>
    </div>

    <div class="auth-card">
      <div class="auth-logo">
        <a href="index.html" class="logo">
          <span class="logo-mark">G</span>
          <span class="logo-text">GenMark<span class="logo-ai">AI</span></span>
        </a>
      </div>
      <h1 class="auth-title">다시 만나요 👋</h1>
      <p class="auth-subtitle">계정에 로그인하여 AI 로고 생성을 시작하세요</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">이메일</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="your@email.com"
            autocomplete="email"
            required
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">비밀번호</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>

        <div style="display:flex;justify-content:flex-end;margin-bottom:24px;">
          <a href="#" style="font-size:0.82rem;color:var(--primary);">비밀번호를 잊으셨나요?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-submit-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          로그인
        </button>
      </form>

      <div class="auth-divider"><span>또는</span></div>

      <div class="auth-link">
        계정이 없으신가요? <a href="register.html" id="go-register-link">무료로 가입하기</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
