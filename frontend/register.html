<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 — GenMark AI</title>
  <meta name="description" content="GenMark AI 계정을 만들고 AI 로고 생성을 무료로 시작하세요." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="nav scrolled" id="main-nav">
    <div class="nav-inner">
      <a href="index.html" class="logo" id="nav-logo">
        <span class="logo-mark">G</span>
        <span class="logo-text">GenMark<span class="logo-ai">AI</span></span>
      </a>
    </div>
  </nav>

  <div class="auth-page">
    <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none;">
      <div class="hero-orb orb-1"></div>
      <div class="hero-orb orb-3"></div>
    </div>

    <div class="auth-card">
      <div class="auth-logo">
        <a href="index.html" class="logo">
          <span class="logo-mark">G</span>
          <span class="logo-text">GenMark<span class="logo-ai">AI</span></span>
        </a>
      </div>
      <h1 class="auth-title">무료로 시작하세요 🚀</h1>
      <p class="auth-subtitle">계정을 만들고 AI 로고 생성을 경험해보세요</p>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="name">이름</label>
          <input
            class="form-input"
            type="text"
            id="name"
            name="name"
            placeholder="홍길동"
            autocomplete="name"
            required
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="email">이메일</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="your@email.com"
            autocomplete="email"
            required
          />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="password">비밀번호</label>
            <input
              class="form-input"
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="new-password"
              required
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="password-confirm">비밀번호 확인</label>
            <input
              class="form-input"
              type="password"
              id="password-confirm"
              name="passwordConfirm"
              placeholder="••••••••"
              autocomplete="new-password"
              required
            />
          </div>
        </div>

        <div style="margin-bottom:24px;">
          <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:0.82rem;color:var(--text-muted);">
            <input type="checkbox" id="agree-terms" style="margin-top:2px;accent-color:var(--primary);" required />
            <span><a href="#" style="color:var(--primary);">이용약관</a> 및 <a href="#" style="color:var(--primary);">개인정보처리방침</a>에 동의합니다.</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="register-submit-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          계정 만들기
        </button>
      </form>

      <div class="auth-link">
        이미 계정이 있으신가요? <a href="login.html" id="go-login-link">로그인</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
