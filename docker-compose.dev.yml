version: '3.8'

services:
  # 1. MariaDB Database Service
  mariadb:
    image: mariadb:10.11
    container_name: genmark-mariadb-dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MARIADB_DATABASE}
      MYSQL_USER: ${MARIADB_USER}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mariadb_dev_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - genmark-dev-net

  # 2. Spring Boot Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genmark-backend-dev
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE}?useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${MARIADB_USER}
      SPRING_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD}
      AI_SERVER_URL: http://ai-server:8000
      PRIVATE_UPLOAD_DIR: /app/private-uploads
      TZ: Asia/Seoul
    volumes:
      - backend_uploads_dev:/app/uploads
      - backend_private_uploads_dev:/app/private-uploads
    networks:
      - genmark-dev-net

  # 3. FastAPI AI Server Service
  ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    container_name: genmark-ai-server-dev
    restart: always
    environment:
      FASTAPI_ENV: production
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-recraft/recraft-v4-vector}
      VALUE_KEYWORD_MODEL: ${VALUE_KEYWORD_MODEL:-upstage/solar-pro4}
      VALUE_KEYWORD_TIMEOUT_SECONDS: ${VALUE_KEYWORD_TIMEOUT_SECONDS:-5}
      MOTIF_TRANSLATION_MODEL: ${MOTIF_TRANSLATION_MODEL:-upstage/solar-pro4}
      MOTIF_TRANSLATION_TIMEOUT_SECONDS: ${MOTIF_TRANSLATION_TIMEOUT_SECONDS:-5}
      EMBEDDINGS_PATH: /app/data/faiss/embeddings.npy
      IDS_PATH: /app/data/faiss/ids.csv
      DATA_MANIFEST_PATH: /app/data/faiss/data_manifest.json
      TRADEMARK_METADATA_PATH: /app/data/trademarks/meta/trademarks.csv
      TRADEMARK_DATA_ROOT: /app/data/trademarks
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      NOTE_MODEL: ${NOTE_MODEL:-google/gemini-2.5-flash-lite}
      NOTE_TIMEOUT_SECONDS: ${NOTE_TIMEOUT_SECONDS:-8}
      DINO_MODEL_ID: facebook/dinov2-base
      DINO_MODEL_REVISION: ${DINO_MODEL_REVISION:-f9e44c814b77203eaa57a6bdbbd535f21ede1415}
      TZ: Asia/Seoul
    networks:
      - genmark-dev-net

  # 4. Nginx Reverse Proxy Service
  nginx:
    image: nginx:alpine
    container_name: genmark-nginx-dev
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - BACKEND_HOST=${BACKEND_HOST}
      - AI_HOST=${AI_HOST}
      - DOMAIN=${DOMAIN}
    volumes:
      - ./infra/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    networks:
      - genmark-dev-net

networks:
  genmark-dev-net:
    driver: bridge

volumes:
  mariadb_dev_data:
  backend_uploads_dev:
  backend_private_uploads_dev:
