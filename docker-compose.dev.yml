version: '3.8'

services:
  # 1. Spring Boot Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genmark-backend-dev
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${MARIADB_DATABASE}?useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${MARIADB_USER}
      SPRING_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD}
      AI_SERVER_URL: http://ai-server:8000
      TZ: Asia/Seoul
    ports:
      - "8080:8080"
    networks:
      - genmark-dev-net

  # 2. FastAPI AI Server Service
  ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    container_name: genmark-ai-server-dev
    restart: always
    environment:
      FASTAPI_ENV: production
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN}
      FAISS_INDEX_PATH: /app/data/faiss/trademark.index
      TZ: Asia/Seoul
    ports:
      - "8000:8000"
    networks:
      - genmark-dev-net

  # 3. Nginx Reverse Proxy Service
  nginx:
    image: nginx:alpine
    container_name: genmark-nginx-dev
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - BACKEND_HOST=${BACKEND_HOST}
      - AI_HOST=${AI_HOST}
      - DOMAIN=${DOMAIN}
    volumes:
      - ./infra/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${LETSENCRYPT_DIR:-./infra/nginx/certs}:/etc/nginx/certs:ro
    networks:
      - genmark-dev-net

networks:
  genmark-dev-net:
    driver: bridge
