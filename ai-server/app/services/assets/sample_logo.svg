<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 물방울 안에 잎 두 장이 감싸는 형태의 심볼 -->
  <g>
    <!-- 바깥 물방울 윤곽 -->
    <path d="M100 30
             C 140 70, 160 100, 160 125
             C 160 158, 133 180, 100 180
             C 67 180, 40 158, 40 125
             C 40 100, 60 70, 100 30 Z"
          fill="none" stroke="#3E6B52" stroke-width="4"/>

    <!-- 왼쪽 잎 -->
    <path d="M100 60
             C 78 78, 62 100, 62 125
             C 62 140, 72 152, 88 156
             C 84 130, 88 95, 100 60 Z"
          fill="#4E8067"/>

    <!-- 오른쪽 잎 -->
    <path d="M100 60
             C 122 78, 138 100, 138 125
             C 138 140, 128 152, 112 156
             C 116 130, 112 95, 100 60 Z"
          fill="#7FAE8E"/>

    <!-- 중앙 잎맥 -->
    <line x1="100" y1="68" x2="100" y2="150" stroke="#2C4A3A" stroke-width="2"/>
  </g>
</svg>