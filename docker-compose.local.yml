services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genmark-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: "jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&sslMode=${DB_SSL_MODE:-disable}"
      SPRING_DATASOURCE_USERNAME: ${DB_APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD}
      AI_SERVER_URL: http://ai-server:8000
      JWT_SECRET: ${JWT_SECRET:-genmark-ai-local-dev-only-jwt-secret-please-change}
      JWT_ACCESS_TOKEN_EXPIRATION_SECONDS: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:-3600}
      JWT_REFRESH_TOKEN_EXPIRATION_DAYS: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-14}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      AUTH_FAKE_PROVIDER_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:5173,http://localhost:5175,http://127.0.0.1:5175
      PRIVATE_UPLOAD_DIR: /app/private-uploads
      TRADEMARK_IMAGE_ROOT: /app/trademark-data
      TRADEMARK_IMAGE_MAX_BYTES: ${TRADEMARK_IMAGE_MAX_BYTES:-5242880}
      TZ: Asia/Seoul
    ports:
      - "${BACKEND_PORT:-8081}:8081"
      - "18080:8081"
    volumes:
      - backend_uploads:/app/uploads
      - backend_private_uploads:/app/private-uploads
      - ./ai-server/data/trademarks:/app/trademark-data:ro
    networks: [genmark-local-net]

  ai-server:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ai-server
    container_name: genmark-ai-server
    restart: unless-stopped
    environment:
      FASTAPI_ENV: ${FASTAPI_ENV:-development}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-recraft/recraft-v4-vector}
      LOGO_FINISH: ${LOGO_FINISH:-solid}
      # 로컬 시연에서는 심볼과 영문 브랜드명을 하나의 워드마크 락업으로 생성한다.
      # 필요하면 .env의 LOGO_WORDMARK로 composer/model을 다시 선택할 수 있다.
      LOGO_WORDMARK: ${LOGO_WORDMARK:-model}
      VALUE_KEYWORD_MODEL: ${VALUE_KEYWORD_MODEL:-upstage/solar-pro4}
      VALUE_KEYWORD_TIMEOUT_SECONDS: ${VALUE_KEYWORD_TIMEOUT_SECONDS:-5}
      MOTIF_TRANSLATION_MODEL: ${MOTIF_TRANSLATION_MODEL:-upstage/solar-pro4}
      MOTIF_TRANSLATION_TIMEOUT_SECONDS: ${MOTIF_TRANSLATION_TIMEOUT_SECONDS:-5}
      KIPRIS_API_KEY: ${KIPRIS_API_KEY:-}
      # The local bundle contains metadata/embeddings but not the full KIPRIS image archive.
      # Keep similarity search available while those optional source images are absent.
      STRICT_IMAGE_CHECK: ${STRICT_IMAGE_CHECK:-false}
      EMBEDDINGS_PATH: /app/data/faiss/embeddings.npy
      IDS_PATH: /app/data/faiss/ids.csv
      DATA_MANIFEST_PATH: /app/data/faiss/data_manifest.json
      TRADEMARK_METADATA_PATH: /app/data/trademarks/meta/trademarks.csv
      TRADEMARK_DATA_ROOT: /app/data/trademarks
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      NOTE_MODEL: ${NOTE_MODEL:-google/gemini-2.5-flash-lite}
      NOTE_TIMEOUT_SECONDS: ${NOTE_TIMEOUT_SECONDS:-8}
      DINO_MODEL_ID: facebook/dinov2-base
      DINO_MODEL_REVISION: ${DINO_MODEL_REVISION:-f9e44c814b77203eaa57a6bdbbd535f21ede1415}
      TZ: Asia/Seoul
    ports:
      - "${AI_SERVER_PORT:-8000}:8000"
    volumes:
      - ./ai-server/data:/app/data:ro
      # KIPRIS 등록 상표 인덱스(위)와 완전히 분리된, 관리자 "유사도 관리 및
      # 테스트" 도구 전용 쓰기 가능한 볼륨. 형식은 KIPRIS와 같은 embeddings.npy
      # + ids.csv이지만, 등록 상표가 아닌 자체 생성 로고만 담는다.
      - ./ai-server/generation-data:/app/generation-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [genmark-local-net]

  nginx:
    image: nginx:alpine
    container_name: genmark-nginx
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks: [genmark-local-net]

networks:
  genmark-local-net:
    driver: bridge

volumes:
  backend_uploads:
  backend_private_uploads:
