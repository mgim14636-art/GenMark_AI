version: '3.8'

services:
  # 1. MariaDB Database Service
  mariadb:
    image: mariadb:10.11
    container_name: genmark-mariadb-local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-genmark_root_pass}
      MYSQL_DATABASE: ${MARIADB_DATABASE:-genmark_db}
      MYSQL_USER: ${MARIADB_USER:-genmark_user}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD:-genmark_pass}
      TZ: Asia/Seoul
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_local_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - genmark-local-net

  # 2. Spring Boot Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genmark-backend-local
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mariadb://${MARIADB_HOST:-localhost}:${MARIADB_PORT:-3306}/${MARIADB_DATABASE:-genmark_db}?useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${MARIADB_USER:-genmark_user}
      SPRING_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD:-genmark_pass}
      AI_SERVER_URL: http://ai-server:8000
      # JWT / 소셜 로그인 (.env에서 주입)
      JWT_SECRET: ${JWT_SECRET:-genmark-ai-local-dev-only-jwt-secret-please-change}
      JWT_ACCESS_TOKEN_EXPIRATION_SECONDS: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:-3600}
      JWT_REFRESH_TOKEN_EXPIRATION_DAYS: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-14}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      AUTH_FAKE_PROVIDER_ENABLED: ${AUTH_FAKE_PROVIDER_ENABLED:-true}
      TZ: Asia/Seoul
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    volumes:
      - backend_local_uploads:/app/uploads
    networks:
      - genmark-local-net

  # 3. FastAPI AI Server Service
  ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    container_name: genmark-ai-server-local
    restart: always
    environment:
      FASTAPI_ENV: development
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TZ: Asia/Seoul
    ports:
      - "${AI_SERVER_PORT:-8000}:8000"
    volumes:
      - ./ai-server/data:/app/data
    networks:
      - genmark-local-net

  # 4. Nginx Reverse Proxy Service
  nginx:
    image: nginx:alpine
    container_name: genmark-nginx-local
    restart: always
    depends_on:
      - backend
      - ai-server
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
      # 저장소 내 frontend를 빌드한 결과물(frontend/dist)을 정적 파일로 서빙한다.
      # nginx 기동 전에 frontend 디렉터리에서 npm install && npm run build 를 먼저 실행할 것.
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - genmark-local-net

networks:
  genmark-local-net:
    driver: bridge

volumes:
  mariadb_local_data:
  backend_local_uploads:
