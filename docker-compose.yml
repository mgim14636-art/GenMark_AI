services:
  backend:
    profiles: [pri]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genmark-backend
    restart: unless-stopped
    depends_on:
      - database
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&sslMode=${DB_SSL_MODE:-verify-full}"
      SPRING_DATASOURCE_USERNAME: ${DB_APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD}
      AI_SERVER_URL: http://ai-server:8000
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      AUTH_FAKE_PROVIDER_ENABLED: ${AUTH_FAKE_PROVIDER_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      PRIVATE_UPLOAD_DIR: /app/private-uploads
      TRADEMARK_IMAGE_ROOT: /app/trademark-data
      TRADEMARK_IMAGE_MAX_BYTES: ${TRADEMARK_IMAGE_MAX_BYTES:-5242880}
      TZ: Asia/Seoul
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    volumes:
      # 공개(public_data) — 로고 생성/수정/브랜드 키트/다운로드 이미지.
      # 컨테이너 안 /app/uploads/{카테고리} 그대로 호스트 /data/public_data/{카테고리}에 쌓인다.
      - /data/public_data/origin_logos:/app/uploads/origin_logos
      - /data/public_data/edit_logos:/app/uploads/edit_logos
      - /data/public_data/brand_kits:/app/uploads/brand_kits
      - /data/public_data/downloads:/app/uploads/downloads
      # 비공개(private_data) — 로고 SVG 원본/편집본/리비전, 명함 인쇄용 SVG·PDF(연락처 포함).
      - /data/private_data/origin_logos:/app/private-uploads/origin_logos
      - /data/private_data/edit_logos:/app/private-uploads/edit_logos
      - /data/private_data/Revision_logos:/app/private-uploads/Revision_logos
      - /data/private_data/brand_kits:/app/private-uploads/brand_kits
      - ./ai-server/data/trademarks:/app/trademark-data:ro
    networks: [genmark-net]

  ai-server:
    profiles: [pri]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ai-server
    container_name: genmark-ai-server
    restart: unless-stopped
    environment:
      FASTAPI_ENV: ${FASTAPI_ENV:-development}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-recraft/recraft-v4-vector}
      LOGO_WORDMARK: ${LOGO_WORDMARK:-model}
      VALUE_KEYWORD_MODEL: ${VALUE_KEYWORD_MODEL:-upstage/solar-pro4}
      VALUE_KEYWORD_TIMEOUT_SECONDS: ${VALUE_KEYWORD_TIMEOUT_SECONDS:-5}
      MOTIF_TRANSLATION_MODEL: ${MOTIF_TRANSLATION_MODEL:-upstage/solar-pro4}
      MOTIF_TRANSLATION_TIMEOUT_SECONDS: ${MOTIF_TRANSLATION_TIMEOUT_SECONDS:-5}
      KIPRIS_API_KEY: ${KIPRIS_API_KEY:-}
      # 원본 상표 이미지가 아직 없어도(임베딩·메타데이터만 있어도) 유사도 검색은 켜둔다.
      STRICT_IMAGE_CHECK: ${STRICT_IMAGE_CHECK:-false}
      EMBEDDINGS_PATH: /app/data/faiss/embeddings.npy
      IDS_PATH: /app/data/faiss/ids.csv
      DATA_MANIFEST_PATH: /app/data/faiss/data_manifest.json
      TRADEMARK_METADATA_PATH: /app/data/trademarks/meta/trademarks.csv
      TRADEMARK_DATA_ROOT: /app/data/trademarks
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      NOTE_MODEL: ${NOTE_MODEL:-google/gemini-2.5-flash-lite}
      NOTE_TIMEOUT_SECONDS: ${NOTE_TIMEOUT_SECONDS:-8}
      DINO_MODEL_ID: facebook/dinov2-base
      DINO_MODEL_REVISION: ${DINO_MODEL_REVISION:-f9e44c814b77203eaa57a6bdbbd535f21ede1415}
      TZ: Asia/Seoul
    ports:
      - "${AI_SERVER_PORT:-8000}:8000"
    volumes:
      - ./ai-server/data:/app/data:ro
      # KIPRIS 등록 상표 인덱스(위, 읽기전용)와 완전히 분리된, 관리자 "유사도
      # 관리 및 테스트" 도구 전용 쓰기 가능한 볼륨. 형식은 KIPRIS와 같은
      # embeddings.npy + ids.csv이지만, 등록 상표가 아닌 자체 생성 로고만 담는다.
      - ./ai-server/generation-data:/app/generation-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [genmark-net]

  # pub 서버 전용: nginx만 기동. 정적 프론트엔드를 서빙하고, VPC 내부망을 통해
  # pri 서버(genmark-pri-svr)의 backend로 API 요청을 넘겨준다.
  nginx:
    profiles: [pub]
    image: nginx:alpine
    container_name: genmark-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.prod.pub.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    networks: [genmark-net]

  # pri 서버 전용: 운영 DB 컨테이너. 로컬 3306으로만 열어두고(관리용) 외부/공인망에는 노출하지 않는다.
  database:
    profiles: [pri]
    image: mariadb:10.11
    container_name: genmark-database
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_APP_USER}
      MARIADB_PASSWORD: ${DB_APP_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - genmark_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [genmark-net]

  local-db:
    profiles: [local-db]
    image: mariadb:10.11
    container_name: genmark-mariadb-local
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:-genmark_root_pass}
      MARIADB_DATABASE: ${LOCAL_DB_NAME:-genmark_db}
      MARIADB_USER: ${LOCAL_DB_USER:-genmark_user}
      MARIADB_PASSWORD: ${LOCAL_DB_PASSWORD:-genmark_pass}
      TZ: Asia/Seoul
    ports:
      - "${LOCAL_DB_PORT:-3307}:3306"
    volumes:
      - local_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [genmark-net]

networks:
  genmark-net:
    driver: bridge

volumes:
  genmark_db_data:
  local_db_data:
