version: '3.8'

services:
  # 1. MariaDB Database Service
  mariadb:
    image: mariadb:10.11
    container_name: genmark-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-genmark_root_pass}
      MYSQL_DATABASE: ${MARIADB_DATABASE:-genmark_db}
      MYSQL_USER: ${MARIADB_USER:-genmark_user}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD:-genmark_pass}
      TZ: Asia/Seoul
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - genmark-net

  # 2. Spring Boot Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genmark-backend
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE:-genmark_db}?useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${MARIADB_USER:-genmark_user}
      SPRING_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD:-genmark_pass}
      AI_SERVER_URL: ${AI_SERVER_URL:-http://ai-server:8000}
      TZ: Asia/Seoul
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - genmark-net

  # 3. FastAPI AI Server Service
  ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    container_name: genmark-ai-server
    restart: always
    environment:
      FASTAPI_ENV: ${FASTAPI_ENV:-development}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      FAISS_INDEX_PATH: /app/data/faiss/trademark.index
      TZ: Asia/Seoul
    ports:
      - "${AI_SERVER_PORT:-8000}:8000"
    volumes:
      - ./ai-server/data:/app/data
    networks:
      - genmark-net

  # 4. Nginx Reverse Proxy Service
  nginx:
    image: nginx:alpine
    container_name: genmark-nginx
    restart: always
    depends_on:
      - backend
      - ai-server
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - genmark-net

networks:
  genmark-net:
    driver: bridge

volumes:
  mariadb_data:
  backend_uploads:
