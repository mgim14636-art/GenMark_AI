<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>GenMark 구글 로그인 테스트</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    pre { background:#111; color:#0f0; padding:12px; border-radius:8px; white-space:pre-wrap; word-break:break-all; }
    h2 { margin-top:28px; }
  </style>
</head>
<body>
  <h1>GenMark 구글 로그인 실검증</h1>
  <p>아래 버튼으로 구글 로그인 → 발급된 ID Token을 백엔드(<code>/api/v1/auth/login</code>)로 전송합니다.</p>

  <!-- client_id: .env의 GOOGLE_CLIENT_ID 와 동일해야 함 -->
  <div id="g_id_onload"
       data-client_id="600397335376-s14h16vlpegkbgktj37slnl35pfbv74c.apps.googleusercontent.com"
       data-callback="onGoogleCredential"></div>
  <div class="g_id_signin" data-type="standard" data-size="large" data-text="signin_with"></div>

  <h2>1) 구글 ID Token</h2>
  <pre id="idtoken">(로그인 대기 중)</pre>

  <h2>2) 백엔드 로그인 응답</h2>
  <pre id="result">(로그인하면 표시됩니다)</pre>

  <script>
    const BACKEND = "http://localhost:18080";
    async function onGoogleCredential(response) {
      const idToken = response.credential;
      document.getElementById("idtoken").textContent = idToken;
      try {
        const res = await fetch(`${BACKEND}/api/v1/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ provider: "google", idToken })
        });
        const text = await res.text();
        document.getElementById("result").textContent = `HTTP ${res.status}\n` + text;
      } catch (e) {
        document.getElementById("result").textContent = "요청 실패: " + e;
      }
    }
  </script>
</body>
</html>
