server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=false

ai.server.url=${AI_SERVER_URL:http://ai-server:8000}

# JWT (access token). JWT_SECRET은 반드시 배포 환경변수로 주입해야 한다 (기본값 없음).
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:14}

# Social login
oauth.google.client-id=${GOOGLE_CLIENT_ID}
oauth.kakao.rest-api-key=${KAKAO_REST_API_KEY:}

# 운영에서는 fake provider를 절대 켜지 않는다.
app.auth.fake-provider-enabled=${AUTH_FAKE_PROVIDER_ENABLED:false}
