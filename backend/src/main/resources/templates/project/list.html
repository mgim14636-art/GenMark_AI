<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{layout/header :: header-head}"></div>
</head>
<body>
<div th:replace="~{layout/header :: header-nav}"></div>

<div class="container">
    <h2>My Projects</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 2rem;">
        <div th:each="project : ${projects}" style="background: #1e293b; padding: 1.5rem; border-radius: 8px;">
            <h3 th:text="${project.title}">Project Title</h3>
            <p th:text="${project.description}" style="color: #94a3b8;">Project Description</p>
            <a th:href="@{'/project/' + ${project.id}}" class="btn-primary" style="display: inline-block; text-decoration: none; font-size: 0.875rem;">View Details</a>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer-content}"></div>
</body>
</html>
