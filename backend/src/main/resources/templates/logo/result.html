<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{layout/header :: header-head}"></div>
    <link rel="stylesheet" th:href="@{/css/logo-result.css}">
    <script th:src="@{/js/similarity.js}"></script>
</head>
<body>
<div th:replace="~{layout/header :: header-nav}"></div>

<div class="container" style="max-width: 600px;">
    <div class="result-card">
        <h2>Generated Logo Result</h2>
        <img th:src="${logo.imageUrl}" alt="Generated Logo" class="result-image">
        <p th:text="${logo.prompt}" style="color: #94a3b8; font-style: italic;"></p>
        <button onclick="runSimilarityCheck()" class="btn-primary">Run Trademark Similarity Search</button>
    </div>
</div>

<script th:inline="javascript">
async function runSimilarityCheck() {
    const logoId = /*[[${logo.id}]]*/ 1;
    const res = await checkSimilarity(logoId);
    if(res.success) {
        window.location.href = '/similarity/result/' + logoId;
    } else {
        alert(res.message || 'Similarity search failed');
    }
}
</script>

<div th:replace="~{layout/footer :: footer-content}"></div>
</body>
</html>
