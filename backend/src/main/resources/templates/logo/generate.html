<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{layout/header :: header-head}"></div>
    <script th:src="@{/js/logo-generate.js}"></script>
</head>
<body>
<div th:replace="~{layout/header :: header-nav}"></div>

<div class="container" style="max-width: 600px;">
    <h2>Generate Logo with FLUX AI</h2>
    <form id="logoForm" onsubmit="handleGenerate(event)">
        <input type="hidden" id="projectId" th:value="${projectId}">
        <div style="margin-bottom: 1.5rem;">
            <label>Describe your logo concept / prompt:</label>
            <textarea id="prompt" required rows="4" style="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; margin-top: 0.5rem;"></textarea>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">Generate Logo</button>
    </form>
</div>

<script>
async function handleGenerate(e) {
    e.preventDefault();
    const projectId = document.getElementById('projectId').value;
    const prompt = document.getElementById('prompt').value;
    const res = await generateLogo(projectId, prompt);
    if(res.success && res.data) {
        window.location.href = '/logo/result/' + res.data.logoId;
    } else {
        alert(res.message || 'Generation failed');
    }
}
</script>

<div th:replace="~{layout/footer :: footer-content}"></div>
</body>
</html>
