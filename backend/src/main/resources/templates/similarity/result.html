<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{layout/header :: header-head}"></div>
</head>
<body>
<div th:replace="~{layout/header :: header-nav}"></div>

<div class="container">
    <h2>Trademark Visual Similarity Report</h2>
    <div style="display: flex; gap: 2rem; margin-top: 2rem;">
        <div style="flex: 1; background: #1e293b; padding: 1.5rem; border-radius: 8px;">
            <h3>Target Logo</h3>
            <img th:src="${logo.imageUrl}" style="max-width: 100%; border-radius: 6px;">
        </div>
        <div style="flex: 2; background: #1e293b; padding: 1.5rem; border-radius: 8px;">
            <h3>Matched Trademarks</h3>
            <div th:each="item : ${results}" style="border-bottom: 1px solid #334155; padding: 1rem 0; display: flex; justify-content: space-between;">
                <div>
                    <strong th:text="${item.matchedTrademarkName}">Trademark Name</strong>
                    <span th:text="${' (' + item.matchedTrademarkId + ')'}" style="color: #94a3b8;"></span>
                </div>
                <div>
                    <span th:text="${#numbers.formatDecimal(item.similarityScore * 100, 1, 2) + '%'}" style="color: #06b6d4; font-weight: bold;"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer-content}"></div>
</body>
</html>
