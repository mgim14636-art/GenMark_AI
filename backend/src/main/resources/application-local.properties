server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/genmark_db?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:genmark_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:genmark_pass}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

ai.server.url=${AI_SERVER_URL:http://localhost:8000}

# JWT (access token). 운영에서는 JWT_SECRET을 반드시 32바이트 이상 랜덤 값으로 교체할 것.
jwt.secret=${JWT_SECRET:genmark-ai-local-dev-only-jwt-secret-please-change}
jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:14}

# Social login
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.kakao.rest-api-key=${KAKAO_REST_API_KEY:}

# 로컬 개발 전용: 실제 구글/카카오 키 없이 provider=fake로 로그인 플로우 테스트 가능
app.auth.fake-provider-enabled=${AUTH_FAKE_PROVIDER_ENABLED:true}
