spring.application.name=GenMark-AI
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Multipart / File upload config
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Upload directory location
file.upload-dir=uploads
app.trademark-image-root=${TRADEMARK_IMAGE_ROOT:../ai-server/data/trademarks}
app.trademark-image-max-bytes=${TRADEMARK_IMAGE_MAX_BYTES:5242880}
app.ai.stale-job-minutes=${AI_STALE_JOB_MINUTES:30}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173,http://localhost:3000,http://localhost:5175,http://127.0.0.1:5175}
