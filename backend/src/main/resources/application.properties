spring.application.name=GenMark-AI
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Multipart / File upload config
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Upload directory location
file.upload-dir=uploads
logo.ai.server.url=${LOGO_AI_SERVER_URL:http://localhost:5000}
app.ai.stale-job-minutes=${AI_STALE_JOB_MINUTES:30}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
