spring.datasource.url=jdbc:h2:mem:genmark;MODE=MariaDB;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
app.auth.fake-provider-enabled=true
jwt.secret=genmark-ai-test-only-jwt-secret-at-least-32-bytes
file.upload-dir=${java.io.tmpdir}/genmark-test-uploads
