<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=406, initial-scale=1" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 406px; height: 860px; margin: 0; overflow: hidden; background: transparent; }
      .phone { width: 406px; height: 860px; padding: 8px; overflow: hidden; border-radius: 50px; background: #000; }
      .screen { width: 390px; height: 844px; overflow: hidden; border-radius: 42px; background: #fff; }
      img { display: block; width: 390px; height: 844px; object-fit: cover; object-position: top left; }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="screen"><img id="capture" alt="GenMark AI mobile screen capture" /></div>
    </div>
    <script>
      const source = new URLSearchParams(window.location.search).get('src')
      const image = document.querySelector('#capture')
      if (!source) throw new Error('The src query parameter is required.')
      image.src = source
    </script>
  </body>
</html>
