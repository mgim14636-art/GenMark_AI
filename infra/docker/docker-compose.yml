version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: genmark-mariadb-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MARIADB_DATABASE}
      MYSQL_USER: ${MARIADB_USER}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mariadb_prod_data:/var/lib/mysql
      - ../../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - genmark-prod-net

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: genmark-backend-prod
    restart: always
    depends_on:
      - mariadb
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE}?useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${MARIADB_USER}
      SPRING_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD}
      AI_SERVER_URL: http://ai-server:8000
    networks:
      - genmark-prod-net

  ai-server:
    build:
      context: ../../ai-server
      dockerfile: Dockerfile
    container_name: genmark-ai-server-prod
    restart: always
    environment:
      FASTAPI_ENV: production
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-recraft/recraft-v4-vector}
      VALUE_KEYWORD_MODEL: ${VALUE_KEYWORD_MODEL:-upstage/solar-pro4}
      VALUE_KEYWORD_TIMEOUT_SECONDS: ${VALUE_KEYWORD_TIMEOUT_SECONDS:-5}
      MOTIF_TRANSLATION_MODEL: ${MOTIF_TRANSLATION_MODEL:-upstage/solar-pro4}
      MOTIF_TRANSLATION_TIMEOUT_SECONDS: ${MOTIF_TRANSLATION_TIMEOUT_SECONDS:-5}
      KIPRIS_API_KEY: ${KIPRIS_API_KEY:-}
      EMBEDDINGS_PATH: /app/data/faiss/embeddings.npy
      IDS_PATH: /app/data/faiss/ids.csv
      DATA_MANIFEST_PATH: /app/data/faiss/data_manifest.json
      TRADEMARK_METADATA_PATH: /app/data/trademarks/meta/trademarks.csv
      TRADEMARK_DATA_ROOT: /app/data/trademarks
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      NOTE_MODEL: ${NOTE_MODEL:-google/gemini-2.5-flash-lite}
      NOTE_TIMEOUT_SECONDS: ${NOTE_TIMEOUT_SECONDS:-8}
      DINO_MODEL_ID: facebook/dinov2-base
      DINO_MODEL_REVISION: ${DINO_MODEL_REVISION:-f9e44c814b77203eaa57a6bdbbd535f21ede1415}
      TZ: Asia/Seoul
    networks:
      - genmark-prod-net

  nginx:
    image: nginx:alpine
    container_name: genmark-nginx-prod
    restart: always
    depends_on:
      - backend
      - ai-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    networks:
      - genmark-prod-net

networks:
  genmark-prod-net:
    driver: bridge

volumes:
  mariadb_prod_data:
