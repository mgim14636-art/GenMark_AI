version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: genmark-mariadb-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MARIADB_DATABASE}
      MYSQL_USER: ${MARIADB_USER}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mariadb_prod_data:/var/lib/mysql
      - ../../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - genmark-prod-net

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: genmark-backend-prod
    restart: always
    depends_on:
      - mariadb
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE}?useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${MARIADB_USER}
      SPRING_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD}
      AI_SERVER_URL: http://ai-server:8000
    networks:
      - genmark-prod-net

  ai-server:
    build:
      context: ../../ai-server
      dockerfile: Dockerfile
    container_name: genmark-ai-server-prod
    restart: always
    environment:
      FASTAPI_ENV: production
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN}
    networks:
      - genmark-prod-net

  nginx:
    image: nginx:alpine
    container_name: genmark-nginx-prod
    restart: always
    depends_on:
      - backend
      - ai-server
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - genmark-prod-net

networks:
  genmark-prod-net:
    driver: bridge

volumes:
  mariadb_prod_data:
