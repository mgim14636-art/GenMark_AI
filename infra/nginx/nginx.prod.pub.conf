worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    # genmark-pri-svr(내부망 전용, 공인 IP 없음)의 backend.
    # 포트는 8080 — NCP ACG에 "WAS 포트"로 등록된 값과 맞춘 것.
    # 서버가 재생성되어도 사설 IP는 보통 유지되지만, 바뀌면 여기만 고치면 된다.
    upstream backend_app {
        server 10.10.20.6:8080;
    }

    server {
        listen 80;
        server_name _;

        # React SPA static files
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            # 구글 로그인 팝업이 postMessage로 결과를 돌려줄 수 있게 허용
            add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        }

        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        }

        # 파일명에 해시가 붙는 Vite 빌드 산출물은 길게 캐시해도 안전하다.
        location /assets/ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Spring Boot API — pri 서버(내부망)로 전달
        location /api/ {
            proxy_pass http://backend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Spring Boot가 저장하는 로고 파일
        location /uploads/ {
            proxy_pass http://backend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
