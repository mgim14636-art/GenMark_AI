name: Deploy GenMark AI project

on:
  push:
    branches: [ main ]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Private server via Public server (bastion) and redeploy backend/ai
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRIVATE_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          proxy_host: ${{ secrets.PUBLIC_HOST }}
          proxy_username: ${{ secrets.SSH_USER }}
          proxy_key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/GenMark_AI
            git pull
            # Ensure non-target services are NOT running on the private server
            docker compose -f docker-compose.dev.yml rm -s -f nginx 2>/dev/null || true
            # Recreate target services (mariadb, backend, ai-server)
            docker compose -f docker-compose.dev.yml rm -s -f mariadb backend ai-server 2>/dev/null || true
            docker compose -f docker-compose.dev.yml up -d --build mariadb backend ai-server

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Public server and redeploy nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PUBLIC_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/GenMark_AI
            git pull
            export DOMAIN="${{ secrets.DOMAIN }}"
            export BACKEND_HOST="${{ secrets.BACKEND_HOST }}"
            export AI_HOST="${{ secrets.AI_HOST }}"
            # Ensure non-target services are NOT running on the public server
            docker compose -f docker-compose.dev.yml rm -s -f mariadb backend ai-server 2>/dev/null || true
            # Recreate target services (nginx)
            docker compose -f docker-compose.dev.yml rm -s -f nginx 2>/dev/null || true
            docker compose -f docker-compose.dev.yml up -d --build nginx
            docker ps
