name: Deploy GenMark AI project

on:
  push:
    branches: [ main ]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: SSH into Private server via Public server (bastion) and redeploy backend/ai
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRIVATE_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          proxy_host: ${{ secrets.PUBLIC_HOST }}
          proxy_username: ${{ secrets.SSH_USER }}
          proxy_key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~/GenMark_AI
            git pull
            # Remove legacy local database container if it exists
            docker rm -f genmark-mariadb-dev 2>/dev/null || true
            # Create/overwrite the .env file automatically using secrets
            echo "DB_HOST=${{ secrets.DB_HOST }}" > .env
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
            echo "MARIADB_DATABASE=${{ secrets.MARIADB_DATABASE }}" >> .env
            echo "MARIADB_USER=${{ secrets.MARIADB_USER }}" >> .env
            echo "MARIADB_PASSWORD=${{ secrets.MARIADB_PASSWORD }}" >> .env
            echo "HUGGINGFACE_TOKEN=${{ secrets.HUGGINGFACE_TOKEN }}" >> .env
            # Build and deploy only target services (backend, ai-server)
            docker compose -f docker-compose.dev.yml up -d --build backend ai-server
            docker compose -f docker-compose.dev.yml ps

  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: SSH into Public server and redeploy nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PUBLIC_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~/GenMark_AI
            git pull
            export LETSENCRYPT_DIR="/etc/letsencrypt"
            export DOMAIN="${{ secrets.DOMAIN }}"
            export BACKEND_HOST="${{ secrets.BACKEND_HOST }}"
            export AI_HOST="${{ secrets.AI_HOST }}"
            # Build and deploy nginx without removing other containers
            docker compose -f docker-compose.dev.yml up -d --build nginx
            docker compose -f docker-compose.dev.yml ps
